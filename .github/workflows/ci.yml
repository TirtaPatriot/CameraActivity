name: CI

# All jobs run on every push to main, pull requests, tags and manual runs
# (public repository: GitHub-hosted runners, macOS included, are free).
# Pull requests from forks get no secrets, so they build the debug APK only.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build server fat JAR
        run: ./gradlew :server:buildFatJar --stacktrace

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: activity-camera-server-jar
          path: server/build/libs/activity-camera-server.jar
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: activity-camera-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Signed release APK, only when the keystore secrets exist (forks build debug only).
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: skipping the signed release build."
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :androidApp:assembleRelease --stacktrace
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload release APK
        if: hashFiles('androidApp/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: activity-camera-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 30

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build for iOS Simulator
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
